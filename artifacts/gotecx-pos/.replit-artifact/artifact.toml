kind = "web"
previewPath = "/"
title = "GotecxPOS"
description = "A Liberia-focused point-of-sale and business management platform for local retailers and service businesses. Opens to sign-in or registration and includes a Shopify-inspired admin workspace, local currency support, and functional browser-stored demo flows without a database."
version = "1.0.0"
id = "artifacts/gotecx-pos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25947

[services.development]
run = "pnpm --filter @workspace/gotecx-pos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gotecx-pos", "run", "build" ]
serve = "static"
publicDir = "artifacts/gotecx-pos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25947"
BASE_PATH = "/"
